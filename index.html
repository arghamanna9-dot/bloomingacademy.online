<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blooming Academy</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header { background:#2e7d32; color:white; padding:15px; text-align:center; }
.container { padding:15px; }
.card {
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
button {
    padding:10px;
    border:none;
    background:#2e7d32;
    color:white;
    border-radius:6px;
}
input { width:100%; padding:8px; margin:5px 0; }
img.logo { width:120px; display:block; margin:auto; }
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">
<h2>Blooming Academy</h2>
</header>

<div class="container">

<div class="card">
<h3>Student Login</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none">

<div class="card">
<h3>📚 Study Materials</h3>
<div id="materials"></div>
</div>

<div class="card">
<h3>📊 Attendance</h3>
<p id="attendance"></p>
</div>

<div class="card">
<h3>💰 Payment</h3>
<p id="payment"></p>
<button onclick="payUPI()">Pay via UPI</button>
</div>

<div class="card">
<h3>📞 Contact</h3>
<button onclick="sendWhatsApp()">WhatsApp Us</button>
</div>

</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
// 🔥 PASTE YOUR FIREBASE CONFIG HERE
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function login() {
  auth.signInWithEmailAndPassword(email.value, password.value)
  .then(() => loadDashboard())
  .catch(e => alert(e.message));
}

function loadDashboard() {
  dashboard.style.display = "block";

  db.collection("materials").get().then(snapshot=>{
    materials.innerHTML="";
    snapshot.forEach(doc=>{
      let d = doc.data();
      materials.innerHTML += `<p><a href="${d.link}" target="_blank">${d.title}</a></p>`;
    });
  });

  db.collection("students").doc(auth.currentUser.uid).get()
  .then(doc=>{
    let d = doc.data();
    attendance.innerText = d.attendance;
    payment.innerText = d.payment;
  });
}

function payUPI() {
  window.location.href = "upi://pay?pa=yourupi@upi&pn=BloomingAcademy&am=500";
}

function sendWhatsApp() {
  window.open("https://wa.me/917872365820");
}
</script>

</body>
</html>
